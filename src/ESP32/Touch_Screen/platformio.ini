[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_ldf_mode = off         ; <-- ADD THIS LINE

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    lvgl/lvgl@^9.5.0
build_flags =
    -I .pio/libdeps/${PIOENV}/lvgl
    -I include
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=240
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=27000000
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_FONT6
    -DLOAD_FONT7
    -DLOAD_FONT8
    -DLOAD_GFXFF
    -DSMOOTH_FONT
    -DLV_CONF_INCLUDE_SIMPLE=1
    -DLV_CONF_PATH=\"lv_conf.h\"